# =====================================================================================
# Tienda+ · entorno local completo
#
#   cp .env.example .env        # (en Windows: copy .env.example .env)
#   docker compose up -d --build
#
# Entrada única: API Gateway Nginx (equivalente local del Ingress HTTPS de Azure)
#   http://localhost:8080/api/v1/products  -> catalog-service
#   http://localhost:8080/api/v1/orders    -> orders-service
#   Swagger: http://localhost:8080/catalog/docs  y  http://localhost:8080/orders/docs
#
# Patrón "database-per-service" con UN contenedor de base de datos por microservicio:
#
#   catalog-service ──▶ catalog-db  (SQL Server 2022, BD catalog_db, volumen propio)
#   orders-service  ──▶ orders-db   (SQL Server 2022, BD orders_db,  volumen propio)
#   orders-service  ──▶ catalog-service  (REST interno: reserve / release)
#
# Contenedores (7):
#   gateway                             Nginx: único puerto publicado (8080)
#   catalog-db / orders-db              SQL Server 2022 (equivalente local de Azure SQL)
#   catalog-db-init / orders-db-init    tareas únicas: crean la BD y su usuario, y terminan
#   catalog-service                     API de catálogo y stock (sin puerto publicado)
#   orders-service                      API de pedidos          (sin puerto publicado)
#
# Redes:
#   edge         red de aplicación: gateway -> APIs y la llamada REST interna
#                orders-service -> catalog-service (DNS por nombre de servicio)
#   catalog-data red interna (internal: true): SOLO catalog-service ve a catalog-db
#   orders-data  red interna (internal: true): SOLO orders-service ve a orders-db
#   Ningún servicio puede llegar a la base de datos del otro, ni siquiera por red.
#
# Requisitos: cada SQL Server pide unos 2 GB de RAM -> asigna al menos 4-5 GB a Docker.
# =====================================================================================
name: tienda-plus

# --- Plantillas reutilizables ----------------------------------------------------------
x-mssql: &mssql
  image: mcr.microsoft.com/mssql/server:2022-latest
  platform: linux/amd64
  restart: unless-stopped
  healthcheck:
    test:
      - CMD-SHELL
      - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s

x-db-init: &db-init
  image: mcr.microsoft.com/mssql/server:2022-latest
  platform: linux/amd64
  restart: "no"
  volumes:
    - ./db/init:/scripts:ro
  entrypoint:
    - /bin/bash
    - -c
    - >-
      /opt/mssql-tools18/bin/sqlcmd -S "$$DB_HOST" -U sa -C -b
      -v DB_NAME="$$DB_NAME" DB_USER="$$DB_USER" DB_PASSWORD="$$DB_PASSWORD"
      -i /scripts/create-database.sql

x-api-hardening: &api-hardening
  restart: unless-stopped
  read_only: true                     # sistema de ficheros inmutable
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ===================================================================================
  # catalog-service + su base de datos
  # ===================================================================================
  catalog-db:
    <<: *mssql
    hostname: catalog-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CATALOG_SA_PASSWORD:?Define CATALOG_SA_PASSWORD en .env}
    volumes:
      - catalog-db-data:/var/opt/mssql   # volumen propio: los datos sobreviven a reinicios
    networks:
      - catalog-data

  catalog-db-init:
    <<: *db-init
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DB_HOST: catalog-db
      SQLCMDPASSWORD: ${CATALOG_SA_PASSWORD}
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD en .env}
    networks:
      - catalog-data

  catalog-service:
    <<: *api-hardening
    build:
      context: ./services/catalog-service
    image: ${IMAGE_PREFIX:-tienda-plus}-catalog-service:${IMAGE_TAG:-local}
    depends_on:
      catalog-db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: catalog-db
      DB_PORT: "1433"
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Define ADMIN_TOKEN en .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Define INTERNAL_API_TOKEN en .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ROOT_PATH: /catalog              # prefijo con el que lo publica el gateway (Swagger)
    # Sin "ports": solo es accesible a través del gateway
    networks:
      - edge
      - catalog-data

  # ===================================================================================
  # orders-service + su base de datos
  # ===================================================================================
  orders-db:
    <<: *mssql
    hostname: orders-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${ORDERS_SA_PASSWORD:?Define ORDERS_SA_PASSWORD en .env}
    volumes:
      - orders-db-data:/var/opt/mssql
    networks:
      - orders-data

  orders-db-init:
    <<: *db-init
    depends_on:
      orders-db:
        condition: service_healthy
    environment:
      DB_HOST: orders-db
      SQLCMDPASSWORD: ${ORDERS_SA_PASSWORD}
      DB_NAME: orders_db
      DB_USER: orders_user
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Define ORDERS_DB_PASSWORD en .env}
    networks:
      - orders-data

  orders-service:
    <<: *api-hardening
    build:
      context: ./services/orders-service
    image: ${IMAGE_PREFIX:-tienda-plus}-orders-service:${IMAGE_TAG:-local}
    depends_on:
      orders-db-init:
        condition: service_completed_successfully
      catalog-service:
        condition: service_healthy
    environment:
      DB_HOST: orders-db
      DB_PORT: "1433"
      DB_NAME: orders_db
      DB_USER: orders_user
      DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      CATALOG_SERVICE_URL: http://catalog-service:8000
      VAT_RATE: ${VAT_RATE:-0.21}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ROOT_PATH: /orders
    # Sin "ports": solo es accesible a través del gateway
    networks:
      - edge
      - orders-data

  # ===================================================================================
  # API Gateway: única puerta de entrada
  # ===================================================================================
  gateway:
    <<: *api-hardening
    build:
      context: ./services/gateway
    image: ${IMAGE_PREFIX:-tienda-plus}-gateway:${IMAGE_TAG:-local}
    depends_on:
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - edge

networks:
  edge:
    driver: bridge
  catalog-data:
    driver: bridge
    internal: true
  orders-data:
    driver: bridge
    internal: true

volumes:
  catalog-db-data:
    name: tienda-plus-catalog-db-data
  orders-db-data:
    name: tienda-plus-orders-db-data
