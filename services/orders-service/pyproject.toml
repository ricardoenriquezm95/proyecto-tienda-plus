[project]
name = "orders-service"
version = "0.2.0"
description = "Tienda+ · pedidos con reserva de stock y cálculo de IVA"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade · S bandit (seguridad) · SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # Depends() en argumentos es el patrón idiomático de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y tokens de prueba en tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pruebas unitarias sin dependencias externas",
    "integration: pruebas de la API completa con BD SQLite en memoria y catálogo simulado",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
