# =====================================================================================
# Tienda+ · API Gateway (Nginx)
# Equivalente local del "Ingress HTTPS" de Azure Container Apps de la arquitectura:
#   /api/v1/products/*  ->  catalog-service:8000
#   /api/v1/orders/*    ->  orders-service:8001
#   /catalog/*          ->  catalog-service (Swagger: /catalog/docs, salud: /catalog/health/live)
#   /orders/*           ->  orders-service  (Swagger: /orders/docs,  salud: /orders/health/live)
# Imagen nginx-unprivileged: escucha en 8080 y se ejecuta como usuario no root (101).
# =====================================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    charset utf-8;
    charset_types application/json;

    # --- Endurecimiento -------------------------------------------------------------
    server_tokens off;                 # no revela la versión de Nginx (cabecera Server / errores)
    client_max_body_size 1m;           # las APIs solo reciben JSON pequeños
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Rutas temporales en /tmp: el contenedor se ejecuta con sistema de ficheros de solo lectura
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Trazabilidad: id de petición propagado a los servicios y logs en JSON -------
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id",'
        '"client":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout json;

    # --- Límite de peticiones (protección frente a abuso / fuerza bruta) -------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=orders_create:10m rate=10r/s;
    limit_req_status 429;

    upstream catalog_service {
        server catalog-service:8000;
        keepalive 16;
    }
    upstream orders_service {
        server orders-service:8001;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Cabeceras de seguridad en todas las respuestas
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Request-ID $req_id always;

        # Proxy hacia los microservicios
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;           # nunca reenvía dos veces un POST (evita doble reserva)

        limit_req zone=api burst=60 nodelay;

        # Solo los métodos que usan las APIs
        if ($request_method !~ ^(GET|POST|PATCH|HEAD|OPTIONS)$) {
            return 405;
        }

        # Endpoints internos (servicio a servicio): NUNCA accesibles desde fuera
        location ~ /api/v1/products/[0-9]+/(reserve|release)$ {
            return 403 '{"detail":"Operación reservada a servicios internos"}';
        }

        # Salud del propio gateway
        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        # Rutas públicas de la API (mismas que el Ingress de Azure)
        location /api/v1/products {
            proxy_pass http://catalog_service;
        }
        location = /api/v1/orders/create {
            limit_req zone=orders_create burst=20 nodelay;
            proxy_pass http://orders_service;
        }
        location /api/v1/orders {
            proxy_pass http://orders_service;
        }

        # Prefijo por servicio: Swagger (/catalog/docs) y salud (/catalog/health/live)
        location /catalog/ {
            proxy_pass http://catalog_service/;
        }
        location /orders/ {
            proxy_pass http://orders_service/;
        }

        location = / {
            return 200 '{"service":"tienda-plus-gateway","catalog_docs":"/catalog/docs","orders_docs":"/orders/docs"}';
        }
        location / {
            return 404 '{"detail":"Ruta no encontrada"}';
        }
    }
}
